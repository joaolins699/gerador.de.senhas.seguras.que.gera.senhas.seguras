<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENHA//TERMINAL_88</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Camada de scanlines + ruído de CRT, fica por cima de tudo via CSS -->
    <div class="crt-overlay"></div>
    <div class="crt-flicker"></div>

    <section class="conteudo">

        <div class="conteudo-titulo">
            <p class="boot-linha">SYS.BOOT :: MÓDULO DE SEGURANÇA v2.5</p>
            <h2 class="titulo-principal glitch" data-texto="GERADOR::SENHAS">GERADOR::SENHAS</h2>
            <h3 class="titulo-secundario">// crie chaves de acesso não rastreáveis</h3>
        </div>

        <div class="conteudo-senha">
            <label for="campo-senha">SENHA_ATUAL</label>
            <div class="campo-senha-linha">
                <span class="prompt">&gt;</span>
                <input name="senha" type="text" id="campo-senha" readonly>
                <button class="botao-copiar" id="botao-copiar" title="Copiar senha">COPIAR</button>
            </div>
        </div>

        <div class="parametro">
            <h3 class="parametro-titulo">CONFIG// personalize sua senha</h3>

            <div class="parametro-coluna__senha">

                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Número de caracteres</h4>
                    <div class="parametro-senha-botoes">
                        <button class="parametro-senha__botao" id="botao-menos">-</button>
                        <p class="parametro-senha__texto">12</p>
                        <button class="parametro-senha__botao" id="botao-mais">+</button>
                    </div>
                </div>

                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Características da senha</h4>
                    <div class="parametro-senha-checkbox">
                        <input name="maiusculo" type="checkbox" class="checkbox" checked>
                        <label for="maiusculo">Letras maiúsculas</label>
                    </div>
                    <div class="parametro-senha-checkbox">
                        <input name="minusculo" type="checkbox" class="checkbox">
                        <label for="minusculo">Letras minúsculas</label>
                    </div>
                    <div class="parametro-senha-checkbox">
                        <input name="numero" type="checkbox" class="checkbox">
                        <label for="numero">Números</label>
                    </div>
                    <div class="parametro-senha-checkbox">
                        <input name="simbolo" type="checkbox" class="checkbox">
                        <label for="simbolo">Símbolos</label>
                    </div>
                    <div class="parametro-senha-checkbox">
                        <input name="emoji" type="checkbox" class="checkbox">
                        <label for="emoji">Emojis 👾</label>
                    </div>
                </div>

                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Força da senha</h4>
                    <div class="barra"></div>
                    <div class="forca fraca"></div>
                    <div class="parametro-senha-textos">
                        <p>Fraca</p>
                        <p>Média</p>
                        <p>Forte</p>
                    </div>
                    <p class="entropia"></p>
                </div>

            </div>
        </div>

        <button class="botao-gerar" id="botao-gerar">[ GERAR NOVA SENHA ]</button>

        <p class="rodape">TERMINAL_88 // conexão criptografada // sem logs mantidos</p>
    </section>

    <script src="script.js"></script>
</body>
</html>
